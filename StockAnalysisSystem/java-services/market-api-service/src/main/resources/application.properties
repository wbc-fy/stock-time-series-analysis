server.port=8083
spring.application.name=market-api-service
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:stock_analysis}?connectTimeout=5000&socketTimeout=5000&serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.read-only=true
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=5
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
market.kafka-group=${MARKET_KAFKA_GROUP:stock-clickhouse-indicators-v1}
market.indicator-topic=${INDICATOR_TOPIC:stock.dws.daily-indicator.v1}
market.listener-enabled=${MARKET_LISTENER_ENABLED:true}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.docker.compose.enabled=false
